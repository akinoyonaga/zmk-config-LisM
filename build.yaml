# This file generates the GitHub Actions matrix.
---
include:
  # Central = Left
  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    snippet: non-trackball-peripheral
    artifact-name: lism_right_peripheral_non_trackball

  - board: seeeduino_xiao_ble
    shield: lism_right rgbled_adapter
    snippet: trackball-peripheral
    artifact-name: lism_right_peripheral_trackball

  - board: seeeduino_xiao_ble
    shield: lism_left rgbled_adapter
    snippet: "non-trackball-central fingerprint-left"
    artifact-name: lism_left_central_non_trackball_fingerprint
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  - board: seeeduino_xiao_ble
    shield: lism_left rgbled_adapter
    snippet: "studio-rpc-usb-uart non-trackball-central fingerprint-left"
    artifact-name: lism_left_central_non_trackball_fingerprint_studio
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  # Reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset-seeeduino_xiao_ble-zmk
